<!doctype html>
<!--
  Planificador de proyectos · un solo archivo HTML, sin instalar nada.
  Ábrelo con doble clic en Edge o Chrome. Vistas directas: planificador.html#avance · planificador.html#hitos

  Contenido de este archivo (buscar "=== " para saltar entre secciones):
    estilos · motor (fechas, festivos, calendario, cronograma) · modelo (EDT, predecesoras) · avance
    archivos (.plan.json, XML de MS Project/ProjectLibre, CSV) · vistas (tabla, Gantt, avance, hitos) · aplicación
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planificador</title>
<style>
/* =================================================================== estilos */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --panel: #ffffff;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --line: #e7e6e1;
  --hover: #f3f3f0;
  --select: #e8f0fe;
  --off: #f1f0ec;
  --accent: #2a78d6;
  --series-1: #2a78d6;
  --series-1-dark: #1c5cab;
  --track: #cde2fb;
  --critical: #d03b3b;
  --critical-dark: #9e2a2a;
  --good: #0ca30c;
  --good-ink: #006300;
  --warning: #fab219;
  --serious: #ec835a;
  --summary: #0b0b0b;
  --ring: #fcfcfb;
  --error-bg: #fdf0f0;
  --shadow: 0 10px 34px rgba(0,0,0,.22);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 13px;
  color: var(--ink);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --panel: #161615;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --line: #2a2a28;
    --hover: #222220;
    --select: #1d2f48;
    --off: #20201e;
    --accent: #3987e5;
    --series-1: #3987e5;
    --series-1-dark: #86b6ef;
    --track: #1c3a5e;
    --critical: #d03b3b;
    --critical-dark: #f0a3a3;
    --good: #0ca30c;
    --good-ink: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --summary: #f0efec;
    --ring: #1a1a19;
    --error-bg: #3a1c1c;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--page); }
body { display: flex; flex-direction: column; }
button, select, input { font: inherit; color: inherit; }
button {
  padding: 5px 10px; border: 1px solid var(--axis); border-radius: 6px; background: var(--panel); cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { color: #fff; filter: brightness(1.08); }
input[type=date], select, .field input { padding: 4px 6px; border: 1px solid var(--axis); border-radius: 6px; background: var(--panel); }

.topbar, .toolbar, .tabs { display: flex; align-items: center; gap: 8px; padding: 7px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
.project-name { font-size: 17px; font-weight: 600; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; width: 340px; background: transparent; }
.project-name:hover, .project-name:focus { border-color: var(--axis); outline: none; }
.field { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.spacer { flex: 1; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.file-info { color: var(--ink-2); white-space: nowrap; }
.file-info .dirty { color: #b45309; font-weight: 600; margin-left: 4px; }
.file-info .saved { color: var(--good-ink); margin-left: 4px; }
@media (prefers-color-scheme: dark) { .file-info .dirty { color: var(--warning); } }

.menu { position: relative; }
.menu > summary { list-style: none; padding: 5px 10px; border: 1px solid var(--axis); border-radius: 6px; cursor: pointer; background: var(--panel); }
.menu > summary::-webkit-details-marker { display: none; }
.menu[open] > summary { border-color: var(--accent); color: var(--accent); }
.menu-list { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; min-width: 300px; background: var(--panel); border: 1px solid var(--axis);
  border-radius: 8px; box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; }
.menu-list button { border: none; text-align: left; padding: 7px 10px; border-radius: 5px; display: flex; justify-content: space-between; gap: 16px; }
.menu-list button:hover { background: var(--hover); }
.menu-list kbd { color: var(--muted); font: inherit; }
.menu-list hr { border: none; border-top: 1px solid var(--line); margin: 4px 2px; width: auto; }

.tabs { padding-top: 0; padding-bottom: 0; gap: 2px; }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 9px 14px; color: var(--ink-2); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .hint { margin-left: auto; color: var(--muted); }

.banner { background: var(--error-bg); color: var(--critical-dark); border-bottom: 1px solid var(--line); padding: 8px 14px; font-weight: 500; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------------- cronograma: tabla + Gantt */
.workspace { flex: 1; display: flex; min-height: 0; background: var(--surface); }
.grid-pane { flex: none; border-right: 2px solid var(--axis); display: flex; flex-direction: column; min-height: 0; }
.grid-body { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.grid-body::-webkit-scrollbar { display: none; }
.grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: 100%; }
.grid thead th { position: sticky; top: 0; z-index: 2; height: 48px; background: var(--panel); color: var(--ink-2); font-weight: 600; text-align: left;
  padding: 0 6px; border-bottom: 1px solid var(--axis); border-right: 1px solid var(--line); }
.grid td { height: 30px; padding: 0 6px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid tr.row:hover td { background: var(--hover); }
.grid tr.selected td { background: var(--select) !important; }
.grid tr.error td { background: var(--error-bg) !important; }
.grid tr.summary td { font-weight: 600; }
.grid tr.critical .c-name input { color: var(--critical-dark); }
.c-row { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.name-wrap { display: flex; align-items: center; gap: 2px; }
.toggle, .star { border: none; background: none; padding: 0 2px; width: 18px; color: var(--muted); }
.star.on { color: #c98500; }
.toggle-space { display: inline-block; width: 18px; flex: none; }
.ms-icon { font-size: 11px; margin-right: 2px; }
.grid tr.critical .ms-icon { color: var(--critical); }
.cell { width: 100%; border: 1px solid transparent; border-radius: 4px; padding: 3px 4px; background: transparent; font-weight: inherit; }
.cell:hover { border-color: var(--axis); }
.cell:focus { border-color: var(--accent); outline: none; background: var(--panel); }
.cell.num { text-align: right; }
.computed { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.computed.zero { color: var(--critical); font-weight: 600; }
.pad { height: 120px; }
.gantt-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.gantt-header { flex: none; height: 48px; overflow: hidden; background: var(--panel); }
.gantt-body { flex: 1; overflow: auto; }
.gantt-body::after { content: ''; display: block; height: 120px; }
svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.g-svg { display: block; }
.g-head { fill: var(--panel); stroke: var(--line); }
.g-head.off { fill: var(--off); }
.g-head-text { font-size: 11px; fill: var(--ink-2); }
.g-head-small { font-size: 10px; fill: var(--muted); }
.g-axis { stroke: var(--axis); }
.g-grid { stroke: var(--grid); }
.g-row { fill: transparent; stroke: var(--line); stroke-width: .5; }
.g-row.selected { fill: var(--select); }
.g-off { fill: var(--off); }
.g-today { stroke: var(--ink-2); stroke-width: 1; }
.g-today-label { font-size: 10px; fill: var(--ink-2); }
.g-bar { cursor: pointer; }
.g-bar-bg { fill: var(--series-1); }
.g-bar-progress { fill: var(--series-1-dark); }
.g-bar.critical .g-bar-bg { fill: var(--critical); }
.g-bar.critical .g-bar-progress { fill: var(--critical-dark); }
.g-bar:hover .g-bar-bg { filter: brightness(1.1); }
.g-summary { fill: var(--summary); cursor: pointer; }
.g-milestone { fill: var(--summary); stroke: var(--ring); stroke-width: 2; cursor: pointer; }
.g-milestone.critical { fill: var(--critical); }
.g-label { font-size: 11px; fill: var(--ink-2); pointer-events: none; }
.g-link { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.g-link.critical { stroke: var(--critical); }
.g-arrow { fill: var(--muted); }
.g-arrow.critical { fill: var(--critical); }

/* ---------------- tableros: avance e hitos */
.board { flex: 1; overflow: auto; padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 16px; }
.board-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.card h2 { margin: 0 0 2px; font-size: 15px; }
.card .sub { margin: 0 0 12px; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: minmax(240px, 1.3fr) repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.tile .label { color: var(--ink-2); }
.tile .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
.tile .value.hero { font-size: 52px; line-height: 1.05; }
.tile .note { color: var(--muted); margin-top: 4px; }
.status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.status .icon { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
.status.completado .icon, .status.al-dia .icon, .status.cumplido .icon { background: var(--good); }
.status.en-riesgo .icon, .status.proximo .icon { background: var(--warning); color: #0b0b0b; }
.status.atrasado .icon, .status.vencido .icon { background: var(--critical); }
.status.sin-iniciar .icon, .status.pendiente .icon { background: var(--muted); }
.legend { display: flex; gap: 18px; align-items: center; color: var(--ink-2); margin-bottom: 8px; flex-wrap: wrap; }
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw-bar { width: 14px; height: 10px; border-radius: 0 3px 3px 0; background: var(--series-1); }
.legend .sw-track { width: 14px; height: 10px; border-radius: 0 3px 3px 0; background: var(--track); }
.legend .sw-mark { width: 2px; height: 14px; background: var(--ink); }
.legend .sw-dia { width: 10px; height: 10px; transform: rotate(45deg); background: var(--muted); }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; }
.c-text { font-size: 12px; fill: var(--ink); }
.c-text-2 { font-size: 12px; fill: var(--ink-2); }
.c-muted { font-size: 11px; fill: var(--muted); }
.c-grid { stroke: var(--grid); stroke-width: 1; }
.c-axis { stroke: var(--axis); stroke-width: 1; }
.c-track { fill: var(--track); }
.c-bar { fill: var(--series-1); }
.c-row:hover .c-bar { filter: brightness(1.12); }
.c-row:hover .c-hit { fill: var(--hover); }
.c-hit { fill: transparent; }
.c-mark { stroke: var(--ink); stroke-width: 2; }
.c-cut { stroke: var(--ink-2); stroke-width: 1; }
.dia { stroke: var(--ring); stroke-width: 2; }
.dia.cumplido { fill: var(--good); }
.dia.vencido { fill: var(--critical); }
.dia.proximo { fill: var(--warning); }
.dia.pendiente { fill: var(--muted); }
.data-table { width: 100%; border-collapse: collapse; }
.data-table th, .data-table td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
.data-table th { color: var(--ink-2); font-weight: 600; }
.data-table td.num, .data-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 20px 0; }
.link-btn { border: none; background: none; color: var(--accent); padding: 0; }

/* ---------------- avisos */
.statusbar { padding: 6px 14px; border-top: 1px solid var(--line); background: var(--panel); color: var(--ink-2); }
.statusbar b { color: var(--ink); }
.statusbar .crit { color: var(--critical); font-weight: 600; }
.toast { position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%); background: #1f2633; color: #fff; padding: 10px 16px;
  border-radius: 8px; box-shadow: var(--shadow); max-width: 600px; z-index: 40; }
.report { border: 1px solid var(--axis); border-radius: 10px; padding: 18px 22px; max-width: 720px; box-shadow: var(--shadow); background: var(--panel); color: var(--ink); }
.report::backdrop { background: rgba(15,23,42,.4); }
.report h3 { margin: 0 0 6px; font-size: 16px; }
.report p { margin: 0 0 10px; color: var(--ink-2); }
.report ul { margin: 0 0 14px; padding-left: 20px; max-height: 50vh; overflow: auto; line-height: 1.5; }
.report form { text-align: right; }
.dropzone { position: fixed; inset: 12px; border: 3px dashed var(--accent); border-radius: 14px; background: rgba(42,120,214,.08); display: flex;
  align-items: center; justify-content: center; font-size: 18px; color: var(--accent); font-weight: 600; z-index: 50; pointer-events: none; }

@media print {
  .topbar, .toolbar, .tabs, .statusbar, .board-controls, .no-print { display: none !important; }
  body, .board { overflow: visible; height: auto; }
  .card, .tile { break-inside: avoid; }
}
</style>

<div id="app" style="display:contents"></div>
<script>
'use strict';
(() => {
/* =================================================================== motor: fechas
   Fechas sin hora (YYYY-MM-DD), siempre en UTC para que la zona horaria no mueva un día. */
const MS_PER_DAY = 86400000;
const ISO_RE = /^(\d{4})-(\d{2})-(\d{2})$/;

function toDayNumber(date) {
  const m = ISO_RE.exec(date);
  if (!m) throw new RangeError(`Fecha inválida (se espera AAAA-MM-DD): ${date}`);
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  const ms = Date.UTC(y, mo - 1, d);
  const c = new Date(ms);
  if (c.getUTCFullYear() !== y || c.getUTCMonth() !== mo - 1 || c.getUTCDate() !== d) throw new RangeError(`La fecha no existe: ${date}`);
  return Math.round(ms / MS_PER_DAY);
}
const fromDayNumber = (day) => new Date(day * MS_PER_DAY).toISOString().slice(0, 10);
const addDays = (date, days) => fromDayNumber(toDayNumber(date) + days);
const weekday = (date) => new Date(toDayNumber(date) * MS_PER_DAY).getUTCDay(); // 0 = domingo
const isoDate = (y, m, d) => fromDayNumber(Math.round(Date.UTC(y, m - 1, d) / MS_PER_DAY));
const isValidDate = (date) => { try { toDayNumber(date); return true; } catch { return false; } };
function todayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

/* =================================================================== motor: festivos de Colombia */
function easterSunday(year) { // algoritmo anónimo gregoriano
  const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return isoDate(year, month, day);
}
/** Ley Emiliani: si el festivo no cae lunes, pasa al lunes siguiente. */
function nextMonday(date) { const wd = weekday(date); return wd === 1 ? date : addDays(date, (8 - wd) % 7); }
/** Los 18 festivos del año: fijos, trasladables al lunes y los que dependen de la Pascua. */
function colombiaHolidays(year) {
  const easter = easterSunday(year);
  const fixed = [[1, 1], [5, 1], [7, 20], [8, 7], [12, 8], [12, 25]].map(([m, d]) => isoDate(year, m, d));
  const emiliani = [[1, 6], [3, 19], [6, 29], [8, 15], [10, 12], [11, 1], [11, 11]].map(([m, d]) => nextMonday(isoDate(year, m, d)));
  const easterBased = [-3, -2, 43, 64, 71].map((n) => addDays(easter, n));
  return [...new Set([...fixed, ...emiliani, ...easterBased])].sort();
}

/* =================================================================== motor: calendario laboral
   Convierte entre fechas e "índice de día laboral desde el inicio del proyecto". */
class WorkCalendar {
  constructor(options = {}) {
    this.weekdays = new Set(options.workingWeekdays || [1, 2, 3, 4, 5]);
    this.holidaysForYear = options.holidaysForYear || colombiaHolidays;
    this.cache = new Map();
  }
  isHoliday(date) {
    const year = Number(date.slice(0, 4));
    if (!this.cache.has(year)) this.cache.set(year, new Set(this.holidaysForYear(year)));
    return this.cache.get(year).has(date);
  }
  isWorkingDay(date) { return this.weekdays.has(weekday(date)) && !this.isHoliday(date); }
  nextWorkingDay(date) {
    let day = toDayNumber(date);
    for (let guard = 0; guard < 3660; guard++, day++) { const d = fromDayNumber(day); if (this.isWorkingDay(d)) return d; }
    throw new RangeError(`No hay días laborales en 10 años desde ${date}`);
  }
  /** Fecha del día laboral número `offset` desde `start` (0 = primer día laboral). Acepta negativos. */
  dateAt(start, offset) {
    let day = toDayNumber(this.nextWorkingDay(start));
    let remaining = offset;
    const step = remaining >= 0 ? 1 : -1;
    while (remaining !== 0) { day += step; if (this.isWorkingDay(fromDayNumber(day))) remaining -= step; }
    return fromDayNumber(day);
  }
  /** Índice laboral de `date` respecto a `start` (inverso de dateAt). */
  offsetOf(start, date) {
    const from = toDayNumber(this.nextWorkingDay(start)), to = toDayNumber(this.nextWorkingDay(date));
    let count = 0;
    const step = to >= from ? 1 : -1;
    for (let day = from; day !== to; day += step) if (this.isWorkingDay(fromDayNumber(day + (step > 0 ? 1 : 0)))) count += step;
    return count;
  }
  /** Días laborales entre dos fechas, ambas incluidas. */
  workingDaysBetween(from, to) {
    if (to < from) return 0;
    let n = 0;
    for (let day = toDayNumber(from); day <= toDayNumber(to); day++) if (this.isWorkingDay(fromDayNumber(day))) n++;
    return n;
  }
}

/* =================================================================== motor: cronograma (ruta crítica)
   Cada tarea ocupa [ES, EF) en días laborales; EF = ES + duración.
   FS: S.ES >= P.EF + L · SS: S.ES >= P.ES + L · FF: S.EF >= P.EF + L · SF: S.EF >= P.ES + L
   Pase hacia adelante (fechas tempranas), hacia atrás (tardías), holgura = LS - ES; crítica si holgura <= 0. */
class ScheduleError extends Error {
  constructor(code, message, taskIds = []) { super(message); this.name = 'ScheduleError'; this.code = code; this.taskIds = taskIds; }
}

function schedule(project, calendar = new WorkCalendar()) {
  const tasks = project.tasks;
  const byId = new Map();
  for (const t of tasks) {
    if (byId.has(t.id)) throw new ScheduleError('DUPLICATE_ID', `El id ${t.id} está repetido`, [t.id]);
    byId.set(t.id, t);
  }
  const children = new Map();
  for (const t of tasks) {
    if (t.parentId == null) continue;
    if (!byId.has(t.parentId)) throw new ScheduleError('UNKNOWN_PARENT', `"${t.name}" tiene una tarea padre inexistente`, [t.id]);
    if (!children.has(t.parentId)) children.set(t.parentId, []);
    children.get(t.parentId).push(t.id);
  }
  for (const t of tasks) {
    const seen = new Set([t.id]);
    let p = t.parentId;
    while (p != null) {
      if (seen.has(p)) throw new ScheduleError('PARENT_CYCLE', 'La EDT tiene un ciclo', [...seen]);
      seen.add(p);
      p = byId.get(p) ? byId.get(p).parentId : null;
    }
  }
  const isSummary = (id) => (children.get(id) || []).length > 0;

  const leaves = new Map();
  for (const t of tasks) {
    const deps = (t.dependencies || []).map((d) => ({ predecessorId: d.predecessorId, type: d.type || 'FS', lag: d.lag || 0 }));
    if (isSummary(t.id)) {
      if (deps.length) throw new ScheduleError('SUMMARY_DEPENDENCY', `La tarea resumen "${t.name}" no puede tener predecesoras; ponlas en sus subtareas`, [t.id]);
      continue;
    }
    if (!Number.isInteger(t.duration) || t.duration < 0) throw new ScheduleError('INVALID_DURATION', `La duración de "${t.name}" debe ser un entero >= 0`, [t.id]);
    for (const d of deps) {
      if (d.predecessorId === t.id) throw new ScheduleError('SELF_DEPENDENCY', `"${t.name}" depende de sí misma`, [t.id]);
      if (!byId.has(d.predecessorId)) throw new ScheduleError('UNKNOWN_TASK', `"${t.name}" depende de una tarea inexistente`, [t.id]);
      if (isSummary(d.predecessorId)) throw new ScheduleError('SUMMARY_DEPENDENCY', `"${t.name}" depende de la tarea resumen "${byId.get(d.predecessorId).name}"; usa una de sus subtareas`, [t.id, d.predecessorId]);

/* =================================================================== modelo: predecesoras estilo MS Project

/* =================================================================== avance a la fecha de corte
   Real = % completado registrado. Planificado = días laborales transcurridos / duración (un hito vale 100
   si su fecha ya pasó). Resúmenes y proyecto: promedio ponderado por duración, como MS Project. */
const PROJECT_KEY = '__proyecto';

const MILESTONE_LABEL = { cumplido: 'Cumplido', vencido: 'Vencido', proximo: 'Próximo', pendiente: 'Pendiente' };

      if (typeof t.percentComplete !== 'number' || t.percentComplete < 0 || t.percentComplete > 100) fail(`${where} con % completado inválido`);

function importMsProjectXml(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new MsProjectImportError('El archivo no es XML válido.');
  const project = doc.documentElement;
  if (!project || project.localName !== 'Project') {
    throw new MsProjectImportError('No es un XML de MS Project. En ProjectLibre o Project usa Archivo > Guardar como > XML.');
  }
  const kids = (el, name) => Array.from(el.children).filter((c) => c.localName === name);
  const child = (el, name) => kids(el, name)[0];
  const text = (el, name) => { const c = child(el, name); return c && c.textContent.trim() ? c.textContent.trim() : undefined; };
  const dateOnly = (v) => (v && /^\d{4}-\d{2}-\d{2}/.test(v) ? v.slice(0, 10) : undefined);
  const warnings = [];
  const minutesPerDay = Number(text(project, 'MinutesPerDay') || 480) || 480;
  const tasksEl = child(project, 'Tasks');
  const rows = [];
  for (const el of tasksEl ? kids(tasksEl, 'Task') : []) {
    const uid = text(el, 'UID');
    const level = Number(text(el, 'OutlineLevel') || 1);
    if (!uid || uid === '0' || level === 0 || text(el, 'IsNull') === '1') continue;
    if (text(el, 'Active') === '0') { warnings.push(`Se omitió la tarea inactiva "${text(el, 'Name') || uid}".`); continue; }
    rows.push({ uid, el, level, name: text(el, 'Name') || `Tarea ${uid}` });
  }
  if (!rows.length) warnings.push('El archivo no tiene tareas.');
  const idOf = new Map(rows.map((r, i) => [r.uid, `t${i + 1}`]));
  const parentOf = new Map();
  const stack = [];
  for (const r of rows) {
    while (stack.length && stack[stack.length - 1].level >= r.level) stack.pop();
    if (stack.length) parentOf.set(r.uid, stack[stack.length - 1].uid);
    stack.push(r);
  }
  const summaries = new Set(parentOf.values());
  const days = new Map();
  for (const r of rows) {
    const raw = text(r.el, 'Duration');
    let d = 0;
    if (raw) {
      const exact = (isoDurationHours(raw) * 60) / minutesPerDay;
      d = Math.max(0, Math.round(exact));
      if (Math.abs(exact - d) > 1e-6 && !summaries.has(r.uid)) warnings.push(`"${r.name}": la duración de ${+exact.toFixed(2)} días se redondeó a ${d} (aquí se usan días enteros).`);
    }
    days.set(r.uid, d);
  }
  const tasks = rows.map((r) => {
    const task = { id: idOf.get(r.uid), name: r.name, duration: summaries.has(r.uid) ? 0 : days.get(r.uid), dependencies: [] };
    if (parentOf.has(r.uid)) task.parentId = idOf.get(parentOf.get(r.uid));
    const pct = Number(text(r.el, 'PercentComplete') || 0);
    if (pct > 0 && !summaries.has(r.uid)) task.percentComplete = Math.min(100, Math.round(pct));
    const ct = text(r.el, 'ConstraintType');
    if (ct === '4') { const cd = dateOnly(text(r.el, 'ConstraintDate')); if (cd) task.startNoEarlierThan = cd; }
    else if (ct && ct !== '0') warnings.push(`"${r.name}": se ignoró una restricción de fecha que no es "No comenzar antes del".`);
    for (const link of kids(r.el, 'PredecessorLink')) {
      const pu = text(link, 'PredecessorUID');
      const pred = rows.find((x) => x.uid === pu);
      if (!pred) { warnings.push(`"${r.name}": se omitió un vínculo hacia una tarea que no está en el archivo.`); continue; }
      if (summaries.has(r.uid) || summaries.has(pu)) {
        warnings.push(`Se quitó el vínculo "${pred.name}" → "${r.name}": aquí no se admiten vínculos con tareas resumen (ponlo en sus subtareas).`);
        continue;
      }
      const lagRaw = Number(text(link, 'LinkLag') || 0);
      const fmt = text(link, 'LagFormat') || '7';
      let lag = fmt === '19' || fmt === '20' ? ((lagRaw / 10) / 100) * days.get(pu) : lagRaw / 10 / minutesPerDay;
      if (!Number.isInteger(lag)) { const r2 = Math.round(lag); warnings.push(`Vínculo "${pred.name}" → "${r.name}": el retraso de ${+lag.toFixed(2)} días se redondeó a ${r2}.`); lag = r2; }
      task.dependencies.push({ predecessorId: idOf.get(pu), type: LINK_TYPES[text(link, 'Type') || '1'] || 'FS', lag });
    }
    return task;
  });
  const startDate = dateOnly(text(project, 'StartDate')) || (rows[0] && dateOnly(text(rows[0].el, 'Start'))) || todayIso();
  const name = text(project, 'Title') || (text(project, 'Name') || 'Proyecto importado').replace(/\.xml$/i, '');

  const status = dateOnly(text(project, 'StatusDate'));
  if (status) plan.statusDate = status;
  return { plan, warnings };
}

/* =================================================================== archivos: exportar XML de MS Project / ProjectLibre
   Incluye un calendario "Colombia" con los festivos, para que allá las fechas den igual que aquí. */
function exportMsProjectXml(plan, result) {
  const x = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const tag = (n, v) => `<${n}>${x(v)}</${n}>`;
  const hours = (d) => `PT${d * 8}H0M0S`;
  const code = { FF: 0, FS: 1, SF: 2, SS: 3 };
  const uidOf = new Map(plan.tasks.map((t, i) => [t.id, i + 1]));
  const wbs = wbsCodes(plan);
  const weekDays = [];
  for (let day = 1; day <= 7; day++) {
    const working = day >= 2 && day <= 6;
    weekDays.push(`<WeekDay>${tag('DayType', day)}${tag('DayWorking', working ? 1 : 0)}${working
      ? '<WorkingTimes><WorkingTime><FromTime>08:00:00</FromTime><ToTime>12:00:00</ToTime></WorkingTime><WorkingTime><FromTime>13:00:00</FromTime><ToTime>17:00:00</ToTime></WorkingTime></WorkingTimes>'
      : ''}</WeekDay>`);
  }
  for (let y = Number(result.startDate.slice(0, 4)) - 1; y <= Number(result.finishDate.slice(0, 4)) + 2; y++) {
    for (const h of colombiaHolidays(y)) weekDays.push(`<WeekDay><DayType>0</DayType><DayWorking>0</DayWorking><TimePeriod>${tag('FromDate', `${h}T00:00:00`)}${tag('ToDate', `${h}T23:59:00`)}</TimePeriod></WeekDay>`);
  }
  const tasks = [`<Task><UID>0</UID><ID>0</ID>${tag('Name', plan.name)}<OutlineNumber>0</OutlineNumber><OutlineLevel>0</OutlineLevel>${tag('Start', `${result.startDate}T08:00:00`)}${tag('Finish', `${result.finishDate}T17:00:00`)}${tag('Duration', hours(result.durationDays))}<DurationFormat>7</DurationFormat><Summary>1</Summary></Task>`];
  plan.tasks.forEach((t, i) => {
    const s = result.tasks[t.id];
    if (!s) return;
    const summary = hasChildren(plan, t.id);
    const links = (t.dependencies || []).filter((d) => uidOf.has(d.predecessorId)).map((d) =>
      `<PredecessorLink>${tag('PredecessorUID', uidOf.get(d.predecessorId))}${tag('Type', code[d.type || 'FS'])}<CrossProject>0</CrossProject>${tag('LinkLag', (d.lag || 0) * 4800)}<LagFormat>7</LagFormat></PredecessorLink>`).join('');
    tasks.push(`<Task>${tag('UID', i + 1)}${tag('ID', i + 1)}${tag('Name', t.name)}<IsNull>0</IsNull>${tag('WBS', wbs[i])}${tag('OutlineNumber', wbs[i])}${tag('OutlineLevel', levelOf(plan, i) + 1)}`
      + `${tag('Start', s.isMilestone ? `${s.finish}T17:00:00` : `${s.start}T08:00:00`)}${tag('Finish', `${s.finish}T17:00:00`)}${tag('Duration', hours(s.duration))}<DurationFormat>7</DurationFormat>`
      + `${tag('PercentComplete', summary ? 0 : Math.round(t.percentComplete || 0))}<Summary>${summary ? 1 : 0}</Summary><Milestone>${s.isMilestone ? 1 : 0}</Milestone><Critical>${s.critical ? 1 : 0}</Critical>`
      + `${t.startNoEarlierThan ? `<ConstraintType>4</ConstraintType>${tag('ConstraintDate', `${t.startNoEarlierThan}T08:00:00`)}` : '<ConstraintType>0</ConstraintType>'}${links}</Task>`);
  });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Project xmlns="http://schemas.microsoft.com/project">
<SaveVersion>14</SaveVersion>${tag('Name', `${plan.name}.xml`)}${tag('Title', plan.name)}<ScheduleFromStart>1</ScheduleFromStart>
${tag('StartDate', `${result.startDate}T08:00:00`)}${tag('FinishDate', `${result.finishDate}T17:00:00`)}
<CalendarUID>1</CalendarUID><DefaultStartTime>08:00:00</DefaultStartTime><DefaultFinishTime>17:00:00</DefaultFinishTime>
<MinutesPerDay>480</MinutesPerDay><MinutesPerWeek>2400</MinutesPerWeek><DaysPerMonth>20</DaysPerMonth>${plan.statusDate ? tag('StatusDate', `${plan.statusDate}T17:00:00`) : ''}
<Calendars><Calendar><UID>1</UID><Name>Colombia</Name><IsBaseCalendar>1</IsBaseCalendar><BaseCalendarUID>-1</BaseCalendarUID><WeekDays>${weekDays.join('')}</WeekDays></Calendar></Calendars>
<Tasks>
${tasks.join('\n')}
</Tasks>
</Project>
`;
}

/* =================================================================== archivos: CSV para Excel (separador ";" y tildes correctas) */
function planToCsv(plan, result, progress) {
  const cell = (v) => { const s = v == null ? '' : String(v); return /[";\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const wbs = wbsCodes(plan);
  const rowOf = new Map(plan.tasks.map((t, i) => [t.id, i + 1]));
  const lines = [['Fila', 'EDT', 'Nombre', 'Tipo', 'Duración (días)', 'Comienzo', 'Fin', 'Predecesoras', '% real', '% planificado', 'Holgura (días)', 'Crítica', 'Hito clave'].join(';')];
  plan.tasks.forEach((t, i) => {
    const s = result && result.tasks[t.id];
    const p = progress && progress[t.id];
    lines.push([i + 1, wbs[i], t.name, s ? (s.isSummary ? 'Resumen' : s.isMilestone ? 'Hito' : 'Tarea') : '', s ? s.duration : t.duration,
      s && s.start, s && s.finish, formatPredecessors(t.dependencies, (id) => rowOf.get(id)),
      p ? p.actual : '', p ? p.planned : '', s ? s.totalSlack : '', s ? (s.critical ? 'Sí' : 'No') : '', t.key ? 'Sí' : ''].map(cell).join(';'));
  });
  return '﻿' + lines.join('\r\n') + '\r\n';
}

/* =================================================================== archivos: abrir y guardar desde el navegador

const PLAN_TYPE = { description: 'Plan del planificador', accept: { 'application/json': ['.json'] } };

const isAbort = (e) => e && e.name === 'AbortError';
async function openFile(types) {
  if (typeof window.showOpenFilePicker === 'function') {
    try {
      const [handle] = await window.showOpenFilePicker({ types, multiple: false });
      const file = await handle.getFile();
      return { name: file.name, text: await file.text(), handle };
    } catch (e) { if (isAbort(e)) return null; throw e; }
  }
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = types.flatMap((t) => Object.values(t.accept).flat()).join(',');
    input.addEventListener('change', async () => { const f = input.files[0]; resolve(f ? { name: f.name, text: await f.text() } : null); });
    input.addEventListener('cancel', () => resolve(null));
    input.click();
  });
}
async function writeToHandle(handle, text) { const w = await handle.createWritable(); await w.write(text); await w.close(); }
async function saveFileAs(suggestedName, text, type, mime) {
  if (typeof window.showSaveFilePicker === 'function') {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName, types: [type] });
      await writeToHandle(handle, text);
      return { handle, name: handle.name };
    } catch (e) { if (isAbort(e)) return null; throw e; }
  }
  download(suggestedName, text, mime);
  return { handle: null, name: suggestedName };
}
function download(name, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: `${mime};charset=utf-8` }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =================================================================== vistas: Gantt del cronograma (SVG) */
const ROW_H = 30, HEAD_H = 48;
const DAY_WIDTH = { dias: 28, semanas: 10, meses: 3 };
const WD_INITIAL = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];

function renderGantt({ tasks, visible, result, calendar, startDate, zoom, selectedId, today }) {
  const dw = DAY_WIDTH[zoom];
  const first = result ? result.startDate : startDate, last = result ? result.finishDate : first;
  const from = addDays(first, -3), to = addDays(last, zoom === 'meses' ? 60 : 21);
  const day0 = toDayNumber(from), days = toDayNumber(to) - day0 + 1;
  const width = days * dw, height = Math.max(visible.length, 1) * ROW_H;
  const xOf = (d) => (toDayNumber(d) - day0) * dw;
  const rowOf = new Map(visible.map((idx, r) => [tasks[idx].id, r]));

  const head = [];
  let monthStart = 0;
  for (let i = 0; i <= days; i++) {
    const d = fromDayNumber(day0 + i);
    if (i === days || (i > 0 && d.slice(8) === '01')) {
      const ms = fromDayNumber(day0 + monthStart), x = monthStart * dw, w = (i - monthStart) * dw;
      head.push(`<rect x="${x}" y="0" width="${w}" height="22" class="g-head"/>`);
      if (w > 30) head.push(`<text x="${x + 6}" y="15" class="g-head-text">${MONTHS[Number(ms.slice(5, 7)) - 1]} ${ms.slice(0, 4)}</text>`);
      monthStart = i;
    }
  }
  for (let i = 0; i < days; i++) {
    const d = fromDayNumber(day0 + i), x = i * dw, wd = weekday(d);
    if (zoom === 'dias') {
      head.push(`<rect x="${x}" y="22" width="${dw}" height="26" class="g-head${calendar.isWorkingDay(d) ? '' : ' off'}"/>`
        + `<text x="${x + dw / 2}" y="33" class="g-head-small" text-anchor="middle">${WD_INITIAL[wd]}</text>`
        + `<text x="${x + dw / 2}" y="44" class="g-head-text" text-anchor="middle">${Number(d.slice(8))}</text>`);
    } else if (zoom === 'semanas' && wd === 1) {
      head.push(`<line x1="${x}" y1="22" x2="${x}" y2="48" class="g-grid"/><text x="${x + 3}" y="39" class="g-head-small">${Number(d.slice(8))} ${MONTHS[Number(d.slice(5, 7)) - 1]}</text>`);
    }
  }
  head.push(`<line x1="0" y1="${HEAD_H - 0.5}" x2="${width}" y2="${HEAD_H - 0.5}" class="g-axis"/>`);

  const body = [];
  visible.forEach((idx, r) => body.push(`<rect x="0" y="${r * ROW_H}" width="${width}" height="${ROW_H}" class="g-row${tasks[idx].id === selectedId ? ' selected' : ''}" data-id="${esc(tasks[idx].id)}"/>`));
  if (zoom !== 'meses') {
    for (let i = 0; i < days; i++) {
      const d = fromDayNumber(day0 + i);
      if (!calendar.isWorkingDay(d)) body.push(`<rect x="${i * dw}" y="0" width="${dw}" height="${height}" class="g-off"><title>${d}${calendar.isHoliday(d) ? ' · festivo' : ''}</title></rect>`);
    }
  }
  if (today >= from && today <= to) {
    const x = xOf(today) + dw / 2;
    body.push(`<line x1="${x}" y1="0" x2="${x}" y2="${height}" class="g-today"><title>Hoy ${today}</title></line>`);
  }
  if (result) {
    const anchor = (id, side) => { const s = result.tasks[id]; return s.isMilestone ? xOf(s.finish) + dw : side === 'start' ? xOf(s.start) : xOf(s.finish) + dw; };
    for (const idx of visible) {
      const t = tasks[idx], sr = rowOf.get(t.id);
      if (!result.tasks[t.id]) continue;
      for (const d of t.dependencies || []) {
        const pr = rowOf.get(d.predecessorId);
        if (pr == null || !result.tasks[d.predecessorId]) continue;
        const type = d.type || 'FS';
        const px = anchor(d.predecessorId, type === 'SS' || type === 'SF' ? 'start' : 'end');
        const toEnd = type === 'FF' || type === 'SF';
        const sx = anchor(t.id, toEnd ? 'end' : 'start');

        else if (sx >= px + 12) path = `M${px},${py} H${px + 6} V${sy} H${sx - 2}`;
        else { const mid = sy > py ? sr * ROW_H + 2 : sr * ROW_H + ROW_H - 2; path = `M${px},${py} H${px + 6} V${mid} H${sx - 10} V${sy} H${sx - 2}`; }
        body.push(`<path d="${path}" class="g-link${crit ? ' critical' : ''}" marker-end="url(#${crit ? 'arrow-crit' : 'arrow'})"/>`);
      }
    }
    visible.forEach((idx, r) => {

      const tip = esc(`${t.name}\n${s.start}${s.isMilestone ? '' : ` → ${s.finish}`} · ${s.duration} d${s.isSummary ? '' : ` · holgura ${s.totalSlack} d`}${s.critical ? ' · ruta crítica' : ''}`);
      if (s.isMilestone) {

        body.push(`<path d="M${cx},${cy - k} L${cx + k},${cy} L${cx},${cy + k} L${cx - k},${cy} Z" class="g-milestone${s.critical ? ' critical' : ''}" data-id="${esc(t.id)}"><title>${tip}</title></path>`
          + `<text x="${cx + 13}" y="${cy + 4}" class="g-label">${t.key ? '★ ' : ''}${esc(t.name)} · ${s.finish.slice(8)}/${s.finish.slice(5, 7)}</text>`);
      } else if (s.isSummary) {
        const x1 = xOf(s.start), x2 = xOf(s.finish) + dw, by = y + 9;
        body.push(`<g class="g-summary" data-id="${esc(t.id)}"><title>${tip}</title><rect x="${x1}" y="${by}" width="${Math.max(x2 - x1, 2)}" height="6"/><path d="M${x1},${by} v12 l6,-6 Z"/><path d="M${x2},${by} v12 l-6,-6 Z"/></g>`);
      } else {
        const x1 = xOf(s.start), x2 = xOf(s.finish) + dw, w = Math.max(x2 - x1 - 2, 2);
        const p = Math.min(Math.max(t.percentComplete || 0, 0), 100);
        body.push(`<g class="g-bar${s.critical ? ' critical' : ''}" data-id="${esc(t.id)}"><title>${tip}</title><rect x="${x1 + 1}" y="${y + 7}" width="${w}" height="${ROW_H - 14}" rx="3" class="g-bar-bg"/>`
          + (p > 0 ? `<rect x="${x1 + 1}" y="${y + 12}" width="${(w * p) / 100}" height="${ROW_H - 24}" rx="2" class="g-bar-progress"/>` : '') + '</g>');
        if (zoom !== 'meses') body.push(`<text x="${x2 + 6}" y="${y + ROW_H / 2 + 4}" class="g-label">${esc(t.name)}</text>`);
      }
    });
  }
  const defs = '<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="g-arrow"/></marker>'
    + '<marker id="arrow-crit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="g-arrow critical"/></marker></defs>';
  return {
    header: `<svg width="${width}" height="${HEAD_H}" class="g-svg">${head.join('')}</svg>`,
    body: `<svg width="${width}" height="${height}" class="g-svg">${defs}${body.join('')}</svg>`,
    xOf,
  };
}

/* =================================================================== vistas: tablero de avance
   Barras horizontales por sección: barra = % real; marca vertical = % planificado a la fecha de corte.
   El estado (al día / en riesgo / atrasado) va con ícono y texto, nunca solo con color. */
function progressSections(plan, level) {
  const summaries = plan.tasks.map((t, i) => ({ t, i })).filter(({ t }) => hasChildren(plan, t.id));
  if (level === 'todas' && summaries.length) return summaries.map(({ t, i }) => ({ id: t.id, name: t.name, depth: levelOf(plan, i) }));
  const top = plan.tasks.map((t, i) => ({ t, i })).filter(({ t }) => t.parentId == null && (hasChildren(plan, t.id) || t.duration > 0));
  return top.map(({ t }) => ({ id: t.id, name: t.name, depth: 0 }));
}

function renderProgressChart(sections, progress, width) {
  const labelW = Math.min(300, Math.max(180, width * 0.26)), statusW = 200, padR = 24;
  const plotW = Math.max(220, width - labelW - statusW - padR);
  const rowH = 40, top = 26, barH = 14, r = 4;
  const height = top + sections.length * rowH + 8;
  const X = (v) => labelW + (Math.min(Math.max(v, 0), 100) / 100) * plotW;
  const out = [];
  for (const v of [0, 25, 50, 75, 100]) {
    out.push(`<line x1="${X(v)}" y1="${top - 6}" x2="${X(v)}" y2="${height - 6}" class="${v === 0 ? 'c-axis' : 'c-grid'}"/>`
      + `<text x="${X(v)}" y="${top - 10}" class="c-muted" text-anchor="middle">${v} %</text>`);
  }
  sections.forEach((s, i) => {
    const p = progress[s.id];
    if (!p) return;
    const y = top + i * rowH, by = y + (rowH - barH) / 2;
    const name = s.name.length > 38 ? `${s.name.slice(0, 36)}…` : s.name;
    const x0 = X(0), x1 = X(p.actual), w = x1 - x0;
    const bar = w <= 0 ? '' : w <= r
      ? `<rect x="${x0}" y="${by}" width="${w}" height="${barH}" class="c-bar"/>`
      : `<path d="M${x0},${by} H${x1 - r} Q${x1},${by} ${x1},${by + r} V${by + barH - r} Q${x1},${by + barH} ${x1 - r},${by + barH} H${x0} Z" class="c-bar"/>`;
    const inside = w > 70;
    const valueLabel = inside
      ? `<text x="${x1 - 8}" y="${by + barH - 3}" text-anchor="end" style="font-size:11px;font-weight:600;fill:#fff">${esc(pct(p.actual))}</text>`
      : `<text x="${x1 + 8}" y="${by + barH - 3}" class="c-text-2">${esc(pct(p.actual))}</text>`;
    const mx = X(p.planned);
    const tip = esc(`${s.name}\nReal ${pct(p.actual)} · Planificado ${pct(p.planned)} · ${pts(p.variance)} · ${STATUS_LABEL[p.status]}`);
    out.push(`<g class="c-row" tabindex="0"><title>${tip}</title>
      <rect x="0" y="${y}" width="${width}" height="${rowH}" class="c-hit"/>
      <text x="${8 + s.depth * 14}" y="${y + rowH / 2 + 4}" class="c-text"${s.depth === 0 ? ' style="font-weight:600"' : ''}>${esc(name)}</text>
      <rect x="${x0}" y="${by}" width="${plotW}" height="${barH}" rx="${r}" class="c-track"/>
      <rect x="${x0}" y="${by}" width="${Math.min(r, plotW)}" height="${barH}" class="c-track"/>
      ${bar}${valueLabel}
      <line x1="${mx}" y1="${by - 5}" x2="${mx}" y2="${by + barH + 5}" class="c-mark"/>
      <foreignObject x="${labelW + plotW + padR}" y="${y + 9}" width="${statusW}" height="24"><div xmlns="http://www.w3.org/1999/xhtml">${statusHtml(p.status, STATUS_ICON[p.status], STATUS_LABEL[p.status], ` <span style="color:var(--muted)">· ${esc(pts(p.variance))}</span>`)}</div></foreignObject>
    </g>`);
  });
  return `<svg width="${width}" height="${height}" role="img" aria-label="Avance real contra planificado por sección">${out.join('')}</svg>`;
}

function renderProgressTable(sections, progress) {
  return `<table class="data-table"><thead><tr><th>Sección</th><th class="num">% real</th><th class="num">% planificado</th><th class="num">Desviación</th><th>Estado</th></tr></thead><tbody>`
    + sections.map((s) => { const p = progress[s.id]; return p ? `<tr><td style="padding-left:${8 + s.depth * 14}px">${esc(s.name)}</td><td class="num">${pct(p.actual)}</td><td class="num">${pct(p.planned)}</td><td class="num">${pts(p.variance)}</td><td>${statusHtml(p.status, STATUS_ICON[p.status], STATUS_LABEL[p.status])}</td></tr>` : ''; }).join('')
    + '</tbody></table>';
}

/* =================================================================== vistas: Gantt de hitos (línea de tiempo) */
function renderMilestoneTimeline(list, statusDate, width) {
  if (!list.length) return '';
  const labelW = Math.min(360, Math.max(220, width * 0.3)), dateW = 110, statusW = 120, padR = 70;
  const plotX = labelW + dateW + statusW, plotW = Math.max(240, width - plotX - padR);
  const rowH = 34, top = 30;
  const height = top + list.length * rowH + 10;
  const dates = list.map((m) => m.date).concat(statusDate).sort();
  const from = addDays(dates[0], -7), to = addDays(dates[dates.length - 1], 7);
  const d0 = toDayNumber(from), span = Math.max(toDayNumber(to) - d0, 1);
  const X = (d) => plotX + ((toDayNumber(d) - d0) / span) * plotW;
  const out = [];
  // meses como guías finas
  let cursor = isoDate(Number(from.slice(0, 4)), Number(from.slice(5, 7)), 1);
  while (cursor <= to) {
    if (cursor > from && X(cursor) - plotX > 56) {
      const x = X(cursor);
      out.push(`<line x1="${x}" y1="${top - 8}" x2="${x}" y2="${height - 6}" class="c-grid"/><text x="${x + 4}" y="${top - 12}" class="c-muted">${MONTHS[Number(cursor.slice(5, 7)) - 1]} ${cursor.slice(2, 4)}</text>`);
    }
    const y = Number(cursor.slice(0, 4)), m = Number(cursor.slice(5, 7));
    cursor = isoDate(m === 12 ? y + 1 : y, m === 12 ? 1 : m + 1, 1);
  }
  out.push(`<text x="${plotX + 4}" y="${top - 12}" class="c-muted">${MONTHS[Number(from.slice(5, 7)) - 1]} ${from.slice(2, 4)}</text>`);
  const cx = X(statusDate);
  out.push(`<line x1="${cx}" y1="${top - 8}" x2="${cx}" y2="${height - 6}" class="c-cut"/><text x="${cx + 4}" y="${height - 10}" class="c-muted">corte ${statusDate.slice(8)}/${statusDate.slice(5, 7)}</text>`);
  list.forEach((m, i) => {
    const y = top + i * rowH, cy = y + rowH / 2, x = X(m.date), k = m.key ? 9 : 7;
    const name = m.name.length > 40 ? `${m.name.slice(0, 38)}…` : m.name;
    const tip = esc(`${m.name}\n${longDate(m.date)} · ${MILESTONE_LABEL[m.status]}${m.section ? ` · ${m.section}` : ''}${m.critical ? ' · ruta crítica' : ''}`);
    out.push(`<g class="c-row"><title>${tip}</title><rect x="0" y="${y}" width="${width}" height="${rowH}" class="c-hit"/>
      <line x1="${plotX}" y1="${cy}" x2="${plotX + plotW}" y2="${cy}" class="c-grid"/>
      <text x="8" y="${cy - 1}" class="c-text"${m.key ? ' style="font-weight:600"' : ''}>${m.key ? '★ ' : ''}${esc(name)}</text>
      <text x="8" y="${cy + 12}" class="c-muted">${esc(m.section || 'Sin fase')}</text>
      <text x="${labelW}" y="${cy + 4}" class="c-text-2">${esc(longDate(m.date))}</text>
      <foreignObject x="${labelW + dateW}" y="${cy - 11}" width="${statusW}" height="24"><div xmlns="http://www.w3.org/1999/xhtml">${statusHtml(m.status, MILESTONE_ICON[m.status], MILESTONE_LABEL[m.status])}</div></foreignObject>
      <path d="M${x},${cy - k} L${x + k},${cy} L${x},${cy + k} L${x - k},${cy} Z" class="dia ${m.status}"/>
      <text x="${x + k + 5}" y="${cy + 4}" class="c-muted">${m.date.slice(8)}/${m.date.slice(5, 7)}</text></g>`);
  });
  return `<svg width="${width}" height="${height}" role="img" aria-label="Línea de tiempo de hitos">${out.join('')}</svg>`;
}

function renderMilestoneTable(list) {
  return `<table class="data-table"><thead><tr><th>Hito</th><th>Fase</th><th>Fecha</th><th>Estado</th><th>Ruta crítica</th></tr></thead><tbody>`
    + list.map((m) => `<tr><td>${m.key ? '★ ' : ''}${esc(m.name)}</td><td>${esc(m.section || '—')}</td><td>${esc(longDate(m.date))}</td><td>${statusHtml(m.status, MILESTONE_ICON[m.status], MILESTONE_LABEL[m.status])}</td><td>${m.critical ? 'Sí' : 'No'}</td></tr>`).join('')
    + '</tbody></table>';
}

const gridBody = $('#grid-body'), ganttBody = $('#gantt-body'), ganttHeader = $('#gantt-header');

ganttBody.addEventListener('scroll', () => { ganttHeader.scrollLeft = ganttBody.scrollLeft; if (syncing) return; syncing = true; gridBody.scrollTop = ganttBody.scrollTop; syncing = false; });

function compute() {
  try { return { result: schedule(plan, calendar), error: null }; } catch (e) { if (e instanceof ScheduleError) return { result: null, error: e }; throw e; }
}
const visibleIndices = () => plan.tasks.map((_, i) => i).filter((i) => !ancestorsOf(plan, i).some((a) => collapsed.has(a)));

function render() {
  for (const id of collapsed) if (!hasChildren(plan, id)) collapsed.delete(id);
  if (selectedId && !plan.tasks.some((t) => t.id === selectedId)) selectedId = null;
  const { result, error } = compute();
  $('#project-name').value = plan.name;
  $('#project-start').value = plan.startDate;
  $('#zoom').value = zoom;
  for (const b of document.querySelectorAll('[data-view]')) b.classList.toggle('on', b.dataset.view === view);
  for (const v of ['cronograma', 'avance', 'hitos']) $(`#view-${v}`).hidden = v !== view;

  const rows = (error ? error.taskIds : []).map((id) => plan.tasks.findIndex((t) => t.id === id) + 1).filter((n) => n > 0).sort((a, b) => a - b);
  $('#banner').hidden = !error;
  $('#banner').textContent = error ? `No se pudo calcular el cronograma: ${error.message}${rows.length ? ` (fila${rows.length > 1 ? 's' : ''} ${rows.join(', ')})` : ''}` : '';

  if (view === 'cronograma') renderSchedule(result, error);
  else if (view === 'avance') renderProgressBoard(result);
  else renderMilestoneBoard(result);

  const dirty = isDirty();
  $('#file-info').innerHTML = `${esc(fileMeta.name || 'Sin archivo')}${dirty ? ' <span class="dirty" title="Cambios sin guardar en el archivo (el navegador sí los conserva)">● sin guardar</span>' : fileMeta.name ? ' <span class="saved">✓ guardado</span>' : ''}`;
  document.title = `${dirty ? '● ' : ''}${plan.name} · Planificador`;

function boardWidth(el) { return Math.max(760, (el.clientWidth || document.body.clientWidth || 1200) - 80); }

      <div class="tile"><div class="label">Fin previsto</div><div class="value">${esc(longDate(result.finishDate))}</div><div class="note">${next ? `próximo hito: ${esc(next.name)} (${esc(longDate(next.date))})` : 'sin hitos pendientes'}</div></div>

      ${sections.length ? `${boardOptions.progressTable ? renderProgressTable(sections, progress) : `<div class="legend"><span class="key"><span class="sw-bar"></span>Avance real</span><span class="key"><span class="sw-mark"></span>Planificado a la fecha de corte</span><span class="key"><span class="sw-track"></span>100 %</span></div><div class="chart">${renderProgressChart(sections, progress, width)}</div>`}` : '<div class="empty">Agrega tareas para ver el avance.</div>'}

      ${ms.some((m) => m.key) ? renderMilestoneTable(ms.filter((m) => m.key)) : ''}

function renderMilestoneBoard(result) {
  const el = $('#board-hitos');
  if (!result) { el.innerHTML = '<div class="empty">Corrige el error del cronograma para ver los hitos.</div>'; return; }
  const cut = statusDate();
  const all = listMilestones(plan, result, cut);
  const list = boardOptions.onlyKey ? all.filter((m) => m.key) : all;
  const count = (s) => all.filter((m) => m.status === s).length;
  el.innerHTML = `
    <div class="board-controls">${cutControl()}
      <label class="field"><input type="checkbox" id="only-key"${boardOptions.onlyKey ? ' checked' : ''}> Solo hitos clave ★</label>
      <label class="field"><input type="checkbox" id="milestone-table"${boardOptions.milestoneTable ? ' checked' : ''}> Ver como tabla</label>
    </div>
    <div class="card">
      <h2>Gantt de hitos</h2>
      <p class="sub">${all.length} hitos · ${count('cumplido')} cumplidos · ${count('vencido')} vencidos · ${count('proximo')} en los próximos ${UPCOMING_DAYS} días. Un hito se cumple al ponerle 100 % en el cronograma.</p>
      ${list.length ? (boardOptions.milestoneTable ? renderMilestoneTable(list) : `<div class="legend">
        <span class="key"><span class="sw-dia" style="background:var(--good)"></span>Cumplido</span><span class="key"><span class="sw-dia" style="background:var(--critical)"></span>Vencido</span>
        <span class="key"><span class="sw-dia" style="background:var(--warning)"></span>Próximo (${UPCOMING_DAYS} días)</span><span class="key"><span class="sw-dia"></span>Pendiente</span>
        <span class="key"><span class="sw-mark" style="width:1px;background:var(--ink-2)"></span>Fecha de corte</span><span class="key">★ hito clave (rombo más grande)</span></div>
        <div class="chart">${renderMilestoneTimeline(list, cut, boardWidth(el))}</div>`)
        : `<div class="empty">${boardOptions.onlyKey ? 'No hay hitos clave. Márcalos con ☆ en la tabla del cronograma.' : 'No hay hitos. Agrega uno con "◆ Hito" en el cronograma.'}</div>`}
    </div>`;
}

let toastTimer = 0;
function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 4500);
}
function showReport(title, intro, items) {
  $('#report-title').textContent = title;
  $('#report-intro').textContent = intro;
  $('#report-list').innerHTML = items.map((i) => `<li>${esc(i)}</li>`).join('');
  $('#report').showModal();
}

/* ----------------------------------------------- archivos */
function confirmDiscard(action) {
  if (!isDirty()) return true;
  return confirm(`Hay cambios sin guardar${fileMeta.name ? ` en "${fileMeta.name}"` : ' (este plan no está guardado en ningún archivo)'}. ¿${action} de todos modos?`);
}
function replacePlan(next, name, handle, saved) {
  collapsed.clear();
  selectedId = next.tasks[0] ? next.tasks[0].id : null;
  fileHandle = handle;
  setFileMeta(name, saved ? snapshot(next) : null);
  commit(next);
  run('goto-start');
}
function loadFileText(name, text, handle) {
  try {
    if (/\.xml$/i.test(name) || text.trimStart().startsWith('<')) {
      const { plan: imported, warnings } = importMsProjectXml(text);
      replacePlan(imported, null, null, false);
      if (warnings.length) showReport('Importación del XML', `Se importaron ${imported.tasks.length} tareas de "${name}". Revisa estos ajustes:`, warnings);
      else toast(`Se importaron ${imported.tasks.length} tareas de "${name}". Guárdalo con "Guardar como…".`);
    } else {
      replacePlan(parsePlanFile(text), name, handle, true);
      toast(`Abierto "${name}".`);
    }
  } catch (e) {
    if (e instanceof PlanFileError || e instanceof MsProjectImportError) showReport('No se pudo abrir el archivo', `"${name}"`, [e.message]);
    else throw e;
  }
}
async function cmdOpen(types) {
  if (!confirmDiscard('Abrir otro archivo')) return;
  const f = await openFile(types);
  if (f) loadFileText(f.name, f.text, f.handle || null);
}
async function cmdSave(forceAs) {
  const text = serializePlan(plan);
  if (fileHandle && !forceAs) {
    await writeToHandle(fileHandle, text);
    setFileMeta(fileHandle.name, snapshot(plan));
    toast(`Guardado en "${fileHandle.name}".`);
    render();
    return;
  }
  const suggested = fileMeta.name && /\.json$/i.test(fileMeta.name) ? fileMeta.name : fileNameFor(plan.name, FILE_EXTENSION);
  const r = await saveFileAs(suggested, text, PLAN_TYPE, 'application/json');
  if (!r) return;
  fileHandle = r.handle;
  setFileMeta(r.name, snapshot(plan));
  toast(r.handle ? `Guardado en "${r.name}".` : `Descargado "${r.name}" (este navegador no permite guardar sobre el mismo archivo).`);
  render();
}
async function cmdExport(kind) {
  const { result } = compute();
  if (!result) { toast('Corrige el error del cronograma antes de exportar.'); return; }
  const r = kind === 'xml'
    ? await saveFileAs(fileNameFor(plan.name, '.xml'), exportMsProjectXml(plan, result), XML_TYPE, 'application/xml')
    : await saveFileAs(fileNameFor(plan.name, '.csv'), planToCsv(plan, result, computeProgress(plan, result, calendar, statusDate())), CSV_TYPE, 'text/csv');
  if (r) toast(kind === 'xml' ? `Exportado "${r.name}". Ábrelo en ProjectLibre o MS Project.` : `Exportado "${r.name}". Ábrelo con Excel.`);
}
function runAsync(promise) {
  promise.catch((e) => { console.error(e); showReport('Ocurrió un error con el archivo', '', [e && e.message ? e.message : String(e)]); });
}
let dragDepth = 0;
window.addEventListener('dragenter', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; $('#dropzone').hidden = false; } });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropzone').hidden = true; });
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0;
  $('#dropzone').hidden = true;
  const file = e.dataTransfer && e.dataTransfer.files[0];
  if (!file || !confirmDiscard('Abrir el archivo soltado')) return;
  runAsync(file.text().then((text) => loadFileText(file.name, text, null)));
});

/* ----------------------------------------------- comandos */
const selectedIndex = () => (selectedId ? plan.tasks.findIndex((t) => t.id === selectedId) : -1);
function setView(v) {
  view = ['cronograma', 'avance', 'hitos'].includes(v) ? v : 'cronograma';
  if (location.hash.slice(1) !== view) history.replaceState(null, '', `#${view}`);
  render();
}
function run(cmd) {
  const idx = selectedIndex();
  $('#file-menu').open = false;
  switch (cmd) {
    case 'add': case 'milestone': {
      if (view !== 'cronograma') setView('cronograma');
      const r = insertTask(plan, idx >= 0 ? idx : null, cmd === 'milestone' ? 'Nuevo hito' : 'Nueva tarea', cmd === 'milestone' ? 0 : 1);
      selectedId = r.plan.tasks[r.index].id;
      pendingFocus = { index: r.index, field: 'name' };
      commit(r.plan);
      break;
    }
    case 'delete': {
      if (idx < 0) return;
      const t = plan.tasks[idx];
      if (hasChildren(plan, t.id) && !confirm(`"${t.name}" tiene subtareas. ¿Eliminarla con todas sus subtareas?`)) return;
      const next = deleteTask(plan, idx);
      selectedId = next.tasks[Math.min(idx, next.tasks.length - 1)] ? next.tasks[Math.min(idx, next.tasks.length - 1)].id : null;
      commit(next);
      break;
    }
    case 'indent': case 'outdent': {
      if (idx < 0) return;
      const next = cmd === 'indent' ? indentTask(plan, idx) : outdentTask(plan, idx);
      if (next === plan) { toast(cmd === 'indent' ? 'No se puede aplicar sangría: no hay una tarea hermana encima.' : 'La tarea ya está en el primer nivel.'); break; }
      const countDeps = (p) => p.tasks.reduce((n, t) => n + (t.dependencies || []).length, 0);
      const removed = countDeps(plan) - countDeps(next);
      const becameSummary = next.tasks.find((t) => hasChildren(next, t.id) && !hasChildren(plan, t.id));
      commit(next);
      if (removed > 0) toast(`"${becameSummary ? becameSummary.name : 'La tarea'}" pasó a ser tarea resumen: se quitaron ${removed} predecesora${removed > 1 ? 's' : ''}. Ponlas en sus subtareas.`);
      break;
    }
    case 'up': case 'down': {
      if (idx < 0) return;
      const r = moveTask(plan, idx, cmd === 'up' ? -1 : 1);
      if (r.plan !== plan) commit(r.plan);
      break;
    }
    case 'sample':
      if (confirmDiscard('Cargar el ejemplo')) replacePlan(samplePlan(sampleStart()), null, null, true);
      break;
    case 'new':
      if (confirmDiscard('Crear un plan nuevo')) replacePlan(emptyPlan(calendar.nextWorkingDay(todayIso())), null, null, true);
      break;
    case 'open': runAsync(cmdOpen([PLAN_TYPE, XML_TYPE])); break;
    case 'import': runAsync(cmdOpen([XML_TYPE])); break;
    case 'save': runAsync(cmdSave(false)); break;
    case 'save-as': runAsync(cmdSave(true)); break;
    case 'export-xml': runAsync(cmdExport('xml')); break;
    case 'export-csv': runAsync(cmdExport('csv')); break;
    case 'print': setTimeout(() => window.print(), 50); break;
    case 'cut-today': { const next = clonePlan(plan); delete next.statusDate; commit(next); break; }
    case 'goto-start': if (lastXOf) ganttBody.scrollLeft = Math.max(lastXOf(plan.startDate) - 40, 0); break;
    case 'goto-today': if (lastXOf) ganttBody.scrollLeft = Math.max(lastXOf(todayIso()) - 200, 0); break;
  }
}

document.addEventListener('click', (e) => {
  const target = e.target;
  const cmdEl = target.closest('[data-cmd]');
  if (cmdEl) { run(cmdEl.dataset.cmd); return; }
  const viewEl = target.closest('[data-view]');
  if (viewEl) { setView(viewEl.dataset.view); return; }
  if (!target.closest('#file-menu')) $('#file-menu').open = false;
  const row = target.closest('tr[data-id], [data-id]');
  const action = target.closest('[data-action]');
  if (action && row) {
    const id = row.dataset.id;
    if (action.dataset.action === 'toggle') { if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id); render(); }
    if (action.dataset.action === 'key') { const t = plan.tasks.find((x) => x.id === id); commit(updateTask(plan, id, { key: !t.key })); }
    return;
  }
  if (row && row.dataset.id && row.dataset.id !== selectedId && row.closest('#view-cronograma')) {
    selectedId = row.dataset.id;
    if (target.dataset && target.dataset.field) pendingFocus = { index: Number(row.closest('tr') ? row.closest('tr').dataset.index : -1), field: target.dataset.field };
    render();
  }
});

document.addEventListener('change', (e) => {
  const input = e.target;
  if (input.id === 'project-name') { commit({ ...plan, name: input.value.trim() || 'Proyecto' }); return; }
  if (input.id === 'project-start') { if (isValidDate(input.value)) commit({ ...plan, startDate: input.value }); return; }
  if (input.id === 'status-date') { if (isValidDate(input.value)) commit({ ...plan, statusDate: input.value }); return; }
  if (input.id === 'zoom') { zoom = DAY_WIDTH[input.value] ? input.value : 'dias'; render(); return; }
  if (input.id === 'level') { boardOptions.level = input.value; render(); return; }
  if (input.id === 'progress-table') { boardOptions.progressTable = input.checked; render(); return; }
  if (input.id === 'only-key') { boardOptions.onlyKey = input.checked; render(); return; }
  if (input.id === 'milestone-table') { boardOptions.milestoneTable = input.checked; render(); return; }
  const field = input.dataset && input.dataset.field;
  const tr = input.closest && input.closest('tr');
  const id = tr && tr.dataset.id;
  if (!field || !id) return;
  const value = input.value;
  if (field === 'name') commit(updateTask(plan, id, { name: value.trim() || 'Sin nombre' }));
  else if (field === 'duration') {
    const n = Number(value);
    if (!Number.isInteger(n) || n < 0) { toast('La duración debe ser un número entero de días laborales (0 = hito).'); render(); return; }
    commit(updateTask(plan, id, { duration: n }));
  } else if (field === 'pct') {
    const n = Math.round(Number(value));
    commit(updateTask(plan, id, { percentComplete: Number.isFinite(n) ? Math.min(Math.max(n, 0), 100) : 0 }));
  } else if (field === 'pred') {
    try {
      const deps = parsePredecessors(value, (row) => (plan.tasks[row - 1] ? plan.tasks[row - 1].id : undefined));
      if (deps.some((d) => d.predecessorId === id)) throw new PredecessorSyntaxError('Una tarea no puede depender de sí misma');
      if (deps.some((d) => hasChildren(plan, d.predecessorId))) throw new PredecessorSyntaxError('No se puede depender de una tarea resumen; usa una de sus subtareas');
      commit(updateTask(plan, id, { dependencies: deps }));
    } catch (err) {
      if (!(err instanceof PredecessorSyntaxError)) throw err;
      toast(err.message);
      render();
    }
  }
});

document.addEventListener('keydown', (e) => {
  const input = e.target;
  const inCell = input.classList && input.classList.contains('cell');
  if (inCell && (e.key === 'Enter' || e.key === 'Escape')) {
    const tr = input.closest('tr');
    if (e.key === 'Enter' && tr) {
      const visible = visibleIndices();
      const nextIndex = visible[visible.indexOf(Number(tr.dataset.index)) + (e.shiftKey ? -1 : 1)];
      if (nextIndex != null) { pendingFocus = { index: nextIndex, field: input.dataset.field }; selectedId = plan.tasks[nextIndex].id; }
    }
    if (e.key === 'Escape') { render(); return; }
    input.blur();
    if (pendingFocus) render();
    e.preventDefault();
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();
  if (mod && key === 's') { e.preventDefault(); if (document.activeElement) document.activeElement.blur(); run(e.shiftKey ? 'save-as' : 'save'); return; }
  if (mod && key === 'o') { e.preventDefault(); run('open'); return; }
  if (mod && e.key === 'Enter') { e.preventDefault(); run('add'); return; }
  if (e.altKey && e.shiftKey) {
    const map = { ArrowRight: 'indent', ArrowLeft: 'outdent', ArrowUp: 'up', ArrowDown: 'down' };
    if (map[e.key]) { e.preventDefault(); run(map[e.key]); return; }
  }
  if (!inCell && e.key === 'Delete' && selectedId && view === 'cronograma' && input.tagName !== 'INPUT') { e.preventDefault(); run('delete'); }
});
window.addEventListener('hashchange', () => setView(location.hash.slice(1)));
let resizeTimer = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (view !== 'cronograma') render(); }, 150); });

view = ['avance', 'hitos'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'cronograma';
render();
run('goto-start');

})();
</script>
